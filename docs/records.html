<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117">
  <title>All-Time Records — Euroleague Analytics</title>
  <meta name="description" content="Euroleague all-time career leaders, single-season records, biggest comebacks, single-game highs and game-winners across 20 seasons.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .records-page { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }

    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; }
    .page-header p  { font-size: 13px; color: var(--text-muted); }

    .cat-tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .cat-tab {
      padding: 6px 16px; border-radius: 8px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid transparent; color: var(--text-muted);
      background: transparent; transition: var(--transition);
    }
    .cat-tab.active { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--border); }
    .cat-tab:hover:not(.active) { color: var(--text-secondary); }

    .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
    .filter-row select {
      background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-secondary);
      border-radius: 6px; padding: 3px 8px; font-size: 11px; font-family: inherit; cursor: pointer;
    }
    .filter-legend { font-size: 11px; color: #334155; }

    .records-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 900px) { .records-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 580px) { .records-grid { grid-template-columns: 1fr; } }
    /* game-record tabs: wider tables, so 3 columns only on wide screens */
    .records-grid.game-grid { grid-template-columns: 1fr 1fr; }
    @media (min-width: 1250px) { .records-grid.game-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 580px) { .records-grid.game-grid { grid-template-columns: 1fr; } }

    .record-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; min-width: 0; }
    .record-card-header {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .rch-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .rch-title.career { color: var(--accent-gold); }
    .rch-title.avg    { color: #818cf8; }
    .rch-title.season { color: var(--accent-green); }
    .rch-sub { font-size: 10px; color: var(--text-muted); }

    .lb-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .lb-table thead th {
      padding: 6px 12px; font-size: 9px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .06em;
      background: var(--bg-primary); text-align: right; white-space: nowrap;
    }
    .lb-table thead th:nth-child(1) { text-align: center; width: 28px; }
    .lb-table thead th:nth-child(2) { text-align: left; }
    .lb-table tbody tr { border-bottom: 1px solid #0f1929; transition: background .12s; }
    .lb-table tbody tr:hover { background: #1a2744; }
    .lb-table tbody tr:last-child { border-bottom: none; }
    .lb-table tbody tr.hidden { display: none; }
    .lb-table td { padding: 8px 12px; text-align: right; color: var(--text-secondary); }
    .lb-table td:nth-child(1) { text-align: center; font-weight: 700; font-size: 11px; }
    .lb-table td:nth-child(2) { text-align: left; }

    @media (max-width: 1250px) {   /* 3-column grid from 901px makes ~300px cards */
      .pl-table td, .pl-table thead th { padding-left: 6px; padding-right: 6px; }
      .pl-table td:nth-child(2) { overflow-wrap: anywhere; }
      .pl-table td:nth-child(3) { overflow-wrap: anywhere; font-size: 11px; }
    }

    .rank-1 { color: var(--accent-gold); }
    .rank-2 { color: #94a3b8; }
    .rank-3 { color: #cd7c2f; }

    .p-name { color: var(--text-primary); font-weight: 600; font-size: 12px; }
    .p-name a { color: var(--text-primary); text-decoration: none; }
    .p-name a:hover { color: var(--accent-blue); }
    .p-meta a { color: inherit; text-decoration: none; }
    .p-meta a:hover { color: var(--accent-blue); }
    .p-meta { font-size: 10px; color: var(--text-muted); display: block; margin-top: 1px; }

    .val-career { color: var(--accent-gold); font-weight: 700; }
    .val-avg    { color: #818cf8; font-weight: 700; }
    .val-season { color: var(--accent-green); font-weight: 700; }
    .rch-title.comeback { color: var(--accent-gold); }
    .rch-title.q4       { color: var(--accent-red); }
    .rch-title.post     { color: var(--accent-green); }
    .val-deficit { color: var(--accent-gold); font-weight: 800; font-size: 15px; }
    .val-deficit .p-meta { font-weight: 400; }
    @media (min-width: 901px) { .val-deficit .p-meta { white-space: nowrap; } }
    .cb-table thead th:nth-child(1) { width: 36px; }
    .cb-table td:nth-child(1) { white-space: nowrap; }
    .cb-table td:nth-child(4) { white-space: nowrap; }
    .cb-new {
      display: inline-block; margin-left: 6px; padding: 0 4px; border: 1px solid currentColor;
      border-radius: 4px; font-size: 9px; font-weight: 700; color: var(--accent-green); vertical-align: 1px;
    }
    .gr-table thead th:nth-child(1) { width: 36px; }
    .gr-table td:nth-child(1) { white-space: nowrap; }
    .gr-table .val-deficit .p-meta { white-space: normal; }
    .gw-table thead th:nth-child(1), .gw-table td:nth-child(1) { text-align: left; width: auto; font-weight: 400; font-size: 12px; }
    .gw-table thead th:nth-child(2), .gw-table td:nth-child(2) { text-align: right; }
    .gw-buzzer {
      display: inline-block; margin-left: 6px; padding: 0 4px; border: 1px solid currentColor;
      border-radius: 4px; font-size: 9px; font-weight: 700; color: var(--accent-red); vertical-align: 1px;
    }

    .show-more-btn {
      width: 100%; padding: 8px 16px; font-size: 11px; color: var(--text-muted);
      text-align: center; cursor: pointer; border-top: 1px solid var(--border);
      background: transparent; border-left: none; border-right: none; border-bottom: none;
      font-family: inherit; transition: color .15s;
    }
    .show-more-btn:hover { color: var(--accent-blue); }

    .error-msg { color: var(--text-muted); text-align: center; padding: 60px; }
  </style>
</head>
<body>

  <nav class="site-nav" id="site-nav">
    <span class="site-nav-brand">🏀 Euroleague Analytics</span>
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" onclick="const n=this.parentElement;const o=n.classList.toggle('nav-open');this.setAttribute('aria-expanded',o)"><span aria-hidden="true">☰</span> Menu</button>
    <a href="index.html" class="nav-link">Season Hub</a>
    <a href="team.html" class="nav-link">Team Deep-Dive</a>
    <a href="players.html" class="nav-link">Player Stats</a>
    <a href="player.html" class="nav-link">Careers</a>
    <a href="compare.html" class="nav-link">Compare</a>
    <a href="h2h.html" class="nav-link">Head-to-Head</a>
    <a href="recap.html" class="nav-link">Game Recap</a>
    <a href="shots.html" class="nav-link">Shot Lab</a>
    <a href="playoffs.html" class="nav-link">Playoffs</a>
    <a href="mvp.html" class="nav-link">MVP Race</a>
    <div class="nav-more" onkeydown="if(event.key==='Escape'&&this.classList.contains('open')){this.classList.remove('open');const b=this.querySelector('.nav-more-btn');b.setAttribute('aria-expanded','false');b.focus();}" onfocusout="if(!this.contains(event.relatedTarget)){this.classList.remove('open');this.querySelector('.nav-more-btn').setAttribute('aria-expanded','false');}">
        <button type="button" class="nav-link nav-more-btn active" aria-expanded="false" onclick="const m=this.parentElement;const o=m.classList.toggle('open');this.setAttribute('aria-expanded',o)">More <span aria-hidden="true">▾</span></button>
        <div class="nav-more-dropdown">
            <a href="network.html" class="nav-link">Playmaking</a>
            <a href="replay.html" class="nav-link">Game Replay</a>
            <a href="records.html" class="nav-link active">All-Time Records</a>
            <a href="game-control.html" class="nav-link">Game Control</a>
            <a href="gci-history.html" class="nav-link">GCI History</a>
            <a href="title-race.html" class="nav-link">Title Race</a>
        <a href="lineups.html" class="nav-link">Lineups</a>
        </div>
    </div>
    <a href="about.html" class="nav-link">About</a>
  </nav>

  <main class="records-page">
    <div class="page-header">
      <h1>🏆 All-Time Records</h1>
      <p>20 seasons · 2007–08 to 2026–27 · Euroleague only</p>
    </div>
    <div id="records-content">
      <p class="error-msg">Loading…</p>
    </div>
  </main>

  <script src="constants.js"></script>
  <script src="records.js"></script>
</body>
</html>
