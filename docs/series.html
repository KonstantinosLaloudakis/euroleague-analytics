    <style>
        /* ── Tale of the Tape ───────────────────────────────────── */
        .tot-rows {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            margin-top: 1rem;
        }

        .tot-row {
            display: grid;
            grid-template-columns: 70px 1fr 70px;
            align-items: center;
            gap: 0.6rem;
        }

        .tot-row-label {
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.2rem;
        }

        .tot-bar-wrap {
            display: flex;
            height: 24px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
        }

        .tot-bar-half {
            display: flex;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-primary);
            padding: 0 0.5rem;
            transition: width 0.3s ease;
        }

        .tot-bar-half.high {
            justify-content: flex-end;
            border-radius: 4px 0 0 4px;
        }

        .tot-bar-half.low {
            justify-content: flex-start;
            border-radius: 0 4px 4px 0;
        }

        .tot-bar-half.dim {
            opacity: 0.45;
        }

        .tot-value {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
        }

        .tot-value.high { text-align: right; }
        .tot-value.low { text-align: left; }
        .tot-value.dim { color: var(--text-muted); font-weight: 600; }

        /* ── Edges panel ────────────────────────────────────────── */
        .tot-edges {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .tot-edges-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .tot-edge {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .tot-edge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }

        /* ── Momentum chart ─────────────────────────────────────── */
        #series-momentum .momentum-callout {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        #series-momentum .momentum-callout strong {
            color: var(--text-primary);
        }

        @media (max-width: 600px) {
            .tot-row { grid-template-columns: 56px 1fr 56px; gap: 0.35rem; }
            .tot-value { font-size: 0.75rem; }
            .tot-bar-half { font-size: 0.68rem; padding: 0 0.35rem; }
        }

        /* ── Simulate From Here ─────────────────────────────────── */
        .sim-card { margin-top: 0; }

        .sim-header {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }

        .sim-header h3 { margin: 0; }

        .sim-subhead {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .sim-summary {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1.1rem;
        }

        .sim-bars {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .sim-bar-row {
            display: grid;
            grid-template-columns: 120px 1fr 50px;
            align-items: center;
            gap: 0.6rem;
        }

        .sim-bar-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .sim-bar-track {
            height: 20px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
        }

        .sim-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
            opacity: 0.85;
        }

        .sim-bar-pct {
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-primary);
            text-align: right;
        }

        .sim-note {
            margin-top: 0.9rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .sim-bar-row { grid-template-columns: 90px 1fr 44px; gap: 0.35rem; }
            .sim-bar-label { font-size: 0.74rem; }
        }

        /* ── Countdown timer ─────────────────────────────────────── */
        .series-game-countdown {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 0.25rem;
            letter-spacing: 0.01em;
            min-height: 1em;
        }

        .series-game-countdown:not(:empty) {
            color: #fbbf24;
        }
    </style>
