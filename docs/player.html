<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117">
  <title>Player Profile — Euroleague Analytics</title>
  <meta name="description" content="Euroleague player career statistics">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .player-page { max-width: 960px; margin: 0 auto; padding: 20px 16px; }

    .breadcrumb { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
    .breadcrumb a { color: var(--accent-blue); text-decoration: none; }

    .hero-card {
      background: linear-gradient(135deg, #0f2942 0%, var(--bg-secondary) 60%);
      border: 1px solid #1e3a5f;
      border-radius: var(--radius);
      padding: 24px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 20px;
      align-items: start;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      .hero-card { grid-template-columns: auto 1fr; }
      .hero-stats-grid { grid-column: 1 / -1; }
    }
    .hero-avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: #1d4ed8; border: 3px solid #2563eb;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 800; color: #93c5fd;
      flex-shrink: 0; object-fit: cover;
    }
    .hero-name { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .hero-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    .hero-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; }
    .tag-team { background: #1e3a8a; color: #93c5fd; }
    .tag-span { background: var(--bg-secondary); color: var(--text-muted); border: 1px solid var(--border); }
    .hero-stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 2px; background: var(--bg-secondary);
      border-radius: 8px; overflow: hidden; min-width: 240px;
    }
    .hero-stat { background: var(--bg-primary); padding: 10px 8px; text-align: center; }
    .hero-stat .val { font-size: 18px; font-weight: 700; color: var(--text-primary); }
    .hero-stat .val.gold  { color: var(--accent-gold); }
    .hero-stat .val.green { color: var(--accent-green); }
    .hero-stat .lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
    .season-label { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
    }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
    .card-sub   { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
    .chart-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .chart-peak   { font-size: 11px; color: var(--text-muted); }
    .pir-chart    { overflow-x: auto; }
    .chart-legend { display: flex; gap: 14px; margin-top: 8px; }
    .legend-item  { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-muted); }
    .legend-dot   { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

    .tab-bar { display: flex; gap: 4px; padding: 12px 14px 0; flex-wrap: wrap; }
    .tab-btn {
      padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 500;
      cursor: pointer; color: var(--text-muted); background: transparent;
      border: 1px solid transparent; transition: var(--transition);
    }
    .tab-btn.active { background: var(--bg-primary); color: var(--text-primary); border-color: var(--border); }
    .stat-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .stat-table thead th {
      padding: 8px 10px; text-align: right; font-size: 10px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em;
      background: var(--bg-primary); cursor: pointer; user-select: none; white-space: nowrap;
    }
    .stat-table thead th:first-child,
    .stat-table thead th:nth-child(2) { text-align: left; }
    .stat-table thead th:hover { color: var(--text-primary); }
    .stat-table tbody tr { border-bottom: 1px solid #0f1929; transition: background .15s; }
    .stat-table tbody tr:hover { background: #1a2744; }
    .stat-table tbody tr.current-szn { background: #0c1f3f; }
    .stat-table td { padding: 8px 10px; text-align: right; color: var(--text-secondary); }
    .stat-table td:first-child { text-align: left; }
    .stat-table td:nth-child(2) { text-align: left; color: var(--text-muted); font-size: 11px; }
    .szn-link { color: var(--accent-blue); font-weight: 600; font-size: 11px; }
    .career-row { background: var(--bg-primary) !important; font-weight: 700; border-top: 1px solid var(--border) !important; }
    .career-row td { color: var(--text-secondary); }
    .val-gold  { color: var(--accent-gold) !important; font-weight: 600; }
    .val-green { color: var(--accent-green) !important; font-weight: 600; }


    .error-msg { color: var(--text-muted); text-align: center; padding: 60px 20px; font-size: 14px; }
  </style>
</head>
