name: Daily WP Replay Update

on:
  schedule:
    # Run at 03:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # same pinned deps as the refresh pipeline (scikit-learn/joblib load the
        # WP model; without them replays silently use the analytic fallback)
        pip install -r requirements.txt

    - name: Fetch Latest Season Data
      run: |
        python fetch_all_seasons.py

    - name: Preprocess WP JSON Data (current season only)
      run: |
        SEASON=$(python -c "import season_config as s; print(s.CURRENT_SEASON)")
        python preprocess_wp_data.py --seasons "$SEASON"

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/data/ data_cache/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update WP Replay data pipeline" && git push)
