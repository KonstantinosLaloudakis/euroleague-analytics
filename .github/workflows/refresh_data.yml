name: Refresh Analytics Data

on:
  schedule:
    # Regular season: Wed-Sat 01:00 UTC (after Tue-Fri games)
    # Playoffs: switch to '0 1 * * *'
    - cron: '0 1 * * 3,4,5,6'
  workflow_dispatch: # Manual trigger button in GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Resolve current season
      id: season
      run: echo "season=$(python -c 'import season_config as s; print(s.CURRENT_SEASON)')" >> "$GITHUB_OUTPUT"

    # Large current-season fetch caches are not committed; persist them between
    # runs so fetchers only request new games. Saved even if the pipeline fails.
    - name: Restore fetch caches
      uses: actions/cache/restore@v4
      with:
        path: |
          pbp_${{ steps.season.outputs.season }}.csv
          shot_data_${{ steps.season.outputs.season }}_${{ steps.season.outputs.season }}.csv
          data/shot_data_${{ steps.season.outputs.season }}_${{ steps.season.outputs.season }}.csv
          data_cache/pbp_lineups_${{ steps.season.outputs.season }}.csv
        key: fetch-cache-${{ steps.season.outputs.season }}-${{ github.run_id }}
        restore-keys: fetch-cache-${{ steps.season.outputs.season }}-

    - name: Run refresh pipeline (skip WP model training — model is in repo)
      run: python refresh_all.py --skip-wp-train
      env:
        MPLBACKEND: Agg
      timeout-minutes: 30

    - name: Save fetch caches
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          pbp_${{ steps.season.outputs.season }}.csv
          shot_data_${{ steps.season.outputs.season }}_${{ steps.season.outputs.season }}.csv
          data/shot_data_${{ steps.season.outputs.season }}_${{ steps.season.outputs.season }}.csv
          data_cache/pbp_lineups_${{ steps.season.outputs.season }}.csv
        key: fetch-cache-${{ steps.season.outputs.season }}-${{ github.run_id }}

    - name: Commit and push if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/data/ docs/*.json
        git add -f *.json *.png 2>/dev/null || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update analytics data" && git push)
